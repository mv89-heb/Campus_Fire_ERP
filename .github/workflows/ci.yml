name: CI

on:
  push:
    branches: [main, hardening/security-data-integrity]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///ci_test.db
          AUTO_CREATE_DB: 'true'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify Alembic configuration
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///ci_migration.db
          AUTO_CREATE_DB: 'true'
        run: flask --app run.py db current
