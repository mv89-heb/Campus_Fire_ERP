name: Supabase Keepalive

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Campus Fire ERP and touch Supabase
        run: |
          curl --silent --show-error --retry 3 --retry-delay 10 --max-time 120 \
            "https://campus-fire-erp.onrender.com/api/system/health" \
            -o /tmp/health.json \
            -w "\nHTTP %{http_code}\n"
          cat /tmp/health.json
