name: Production Health Check

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --retry-connrefused --max-time 120 \
            "https://campus-fire-erp.onrender.com/api/system/health" \
            --output /tmp/health.json \
            --write-out "\nHTTP %{http_code}\n"

          python - <<'PY'
          import json
          import sys

          with open("/tmp/health.json", encoding="utf-8") as health_file:
              health = json.load(health_file)

          required_checks = (
              "db_connected",
              "zones_seeded",
              "upload_folder_writable",
              "supabase_configured",
              "storage_connected",
              "gemini_configured",
          )
          failed = [name for name in required_checks if health.get(name) is not True]
          if health.get("status") != "ok" or failed:
              print("Production readiness check failed.")
              print("Failed checks:", ", ".join(failed) if failed else "status is not ok")
              print("Health status:", health.get("status", "missing"))
              sys.exit(1)

          print("Production readiness passed: database, catalog, local temp storage, Supabase Storage and Gemini configuration.")
          PY