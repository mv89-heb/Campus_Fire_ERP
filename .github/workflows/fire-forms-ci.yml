name: Fire Forms CI

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/test_fire_form_uploads.py"
      - "requirements.txt"
      - ".github/workflows/fire-forms-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/test_fire_form_uploads.py"
      - "requirements.txt"
      - ".github/workflows/fire-forms-ci.yml"

permissions:
  contents: read

jobs:
  fire-forms-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fire form validation and route regression tests
        run: python -m unittest discover -s tests -p "test_fire_form_uploads.py" -v
