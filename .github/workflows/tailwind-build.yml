name: Tailwind Asset Build

on:
  push:
    branches:
      - feat/enterprise-ui-tooling-2026-11-22
    paths:
      - "package.json"
      - "tailwind.config.cjs"
      - "app/static/css/tailwind.input.css"
      - "app/templates/**"
      - "app/static/**/*.js"
      - ".github/workflows/tailwind-build.yml"

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned frontend build dependency
        run: npm install --no-audit --no-fund
      - name: Build local utility stylesheet
        run: npm run build:css
      - name: Commit generated CSS and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/static/css/tailwind.generated.css
          if ! git diff --cached --quiet; then
            git commit -m "build(ui): generate local Tailwind utility stylesheet"
            git push
          fi
