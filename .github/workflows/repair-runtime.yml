name: Repair runtime import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Flask session import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/routes.py')
          s = p.read_text(encoding='utf-8')
          old = 'from flask import Blueprint, jsonify, request, current_app, render_template, send_file, redirect'
          new = 'from flask import Blueprint, jsonify, request, current_app, render_template, send_file, redirect, session'
          if old in s and 'redirect, session' not in s.splitlines()[0]:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/routes.py
          git diff --cached --quiet || git commit -m 'Fix Flask session import runtime error'
          git push
      - name: Remove temporary repair workflow
        run: |
          git rm .github/workflows/repair-runtime.yml
          git commit -m 'Remove temporary runtime repair workflow'
          git push
